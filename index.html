<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Drive Bài Giảng</title>
  <style>
    :root {
      --bg-shell: #f8fafd;
      --bg-surface: #ffffff;
      --bg-card: #f0f4f9;
      --bg-card-hover: #dfe3e7;
      --bg-search: #e9eef6;
      --bg-active-pill: #c2e7ff;
      --text-primary: #1f1f1f;
      --text-secondary: #444746;
      --text-muted: #5f6368;
      --accent-blue: #0b57d0;
      --accent-red: #d93025;
      --border-color: #dadce0;
      --chip-border: #747775;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Google Sans", Roboto, "Segoe UI", sans-serif;
      background: var(--bg-shell);
      color: var(--text-primary);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Header */
    .topbar {
      height: 60px;
      display: flex;
      align-items: center;
      padding: 8px 16px;
      gap: 14px;
      flex-shrink: 0;
    }

    .brand {
      width: 224px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      color: var(--text-secondary);
      font-weight: 600;
      user-select: none;
      flex-shrink: 0;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, #1a73e8, #34a853, #fbbc04, #ea4335);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
    }

    .search-wrapper {
      flex: 1;
      max-width: 720px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      color: var(--text-secondary);
      pointer-events: none;
      font-size: 15px;
    }

    .search-input {
      width: 100%;
      height: 44px;
      padding: 0 38px 0 40px;
      border-radius: 999px;
      border: none;
      background: var(--bg-search);
      font-size: 16px; /* 16px chống iOS Safari tự zoom khi bấm vào ô tìm kiếm */
      color: var(--text-primary);
      outline: none;
    }

    .search-input:focus {
      background: #ffffff;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.22);
    }

    .clear-search {
      position: absolute;
      right: 10px;
      width: 28px;
      height: 28px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 16px;
      display: none;
    }

    /* Mobile Sync Pill trên Topbar */
    .mobile-sync-badge {
      display: none;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    /* App Layout */
    .app-body {
      flex: 1;
      display: flex;
      overflow: hidden;
      padding: 0 16px 16px 0;
    }

    /* Left Sidebar (Desktop) */
    .sidebar {
      width: 240px;
      padding: 4px 12px 16px 12px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sync-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      margin: 0 4px 16px 4px;
      background: #ffffff;
      color: var(--text-primary);
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 1px 3px rgba(60, 64, 67, 0.2);
    }

    .sync-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #1a73e8;
      flex-shrink: 0;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .sync-dot.done {
      background: #34a853;
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 38px;
      padding: 0 16px;
      border-radius: 999px;
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
    }

    .nav-item.active {
      background: var(--bg-active-pill);
      color: #001d35;
      font-weight: 600;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-count {
      font-size: 12px;
      color: var(--text-muted);
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 14px 16px;
      border-top: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .sidebar-footer a {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 500;
    }

    /* Main Workspace */
    .workspace {
      flex: 1;
      background: var(--bg-surface);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #edf0f5;
    }

    .workspace-header {
      padding: 14px 20px 10px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-bottom: 1px solid #f1f3f4;
      flex-shrink: 0;
    }

    .workspace-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .workspace-title {
      font-size: 20px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .view-toggle {
      display: inline-flex;
      border: 1px solid var(--chip-border);
      border-radius: 999px;
      overflow: hidden;
      height: 32px;
    }

    .view-btn {
      border: none;
      background: transparent;
      padding: 0 12px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .view-btn.active {
      background: var(--bg-active-pill);
      color: #001d35;
      font-weight: 600;
    }

    /* Filter Chips (Vuốt ngang mượt trên iPhone) */
    .chips-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 2px;
    }

    .chips-row::-webkit-scrollbar {
      display: none;
    }

    .chip {
      height: 32px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--chip-border);
      background: #ffffff;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .chip.active {
      background: #e8f0fe;
      border-color: #1a73e8;
      color: #1967d2;
    }

    /* Content Scroll Area */
    .content-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px 20px 32px 20px;
    }

    .section-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    /* Grid View (Drive Card Style) */
    .drive-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
      gap: 14px;
    }

    .drive-card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      user-select: none;
      contain: layout style;
    }

    @media (hover: hover) {
      .drive-card:hover {
        background: var(--bg-card-hover);
      }
      .nav-item:hover {
        background: #e8ebee;
      }
      .drive-card:hover .play-overlay {
        opacity: 1;
      }
    }

    .drive-card:active {
      background: var(--bg-card-hover);
    }

    .drive-card.playing {
      outline: 2px solid var(--accent-blue);
      background: #e8f0fe;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      height: 24px;
    }

    .card-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      flex: 1;
    }

    .video-badge-icon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: var(--accent-red);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .star-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 17px;
      color: var(--text-muted);
      padding: 4px;
      line-height: 1;
      flex-shrink: 0;
    }

    .star-btn.starred {
      color: #fbbc04;
    }

    .card-thumb-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #1f1f1f;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-placeholder {
      color: rgba(255, 255, 255, 0.7);
      font-size: 26px;
    }

    .duration-pill {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .play-overlay {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      opacity: 0;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      padding: 0 2px;
    }

    /* List View */
    .drive-list {
      width: 100%;
      border-collapse: collapse;
    }

    .drive-list th {
      text-align: left;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      padding: 10px 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .drive-list td {
      padding: 10px 8px;
      border-bottom: 1px solid #f1f3f4;
      font-size: 13.5px;
      color: var(--text-primary);
    }

    .drive-list tr {
      cursor: pointer;
    }

    .scroll-sentinel {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 12px;
    }

    /* Bottom Navigation Bar cho iPhone / Mobile */
    .mobile-bottom-nav {
      display: none;
      background: #ffffff;
      border-top: 1px solid var(--border-color);
      padding: 6px 8px calc(6px + var(--safe-bottom)) 8px;
      justify-content: space-around;
      align-items: center;
      flex-shrink: 0;
      z-index: 50;
    }

    .mob-nav-btn {
      flex: 1;
      border: none;
      background: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 4px 0;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }

    .mob-nav-pill {
      padding: 3px 18px;
      border-radius: 999px;
      font-size: 16px;
      line-height: 1.2;
    }

    .mob-nav-btn.active {
      color: #001d35;
      font-weight: 600;
    }

    .mob-nav-btn.active .mob-nav-pill {
      background: var(--bg-active-pill);
    }

    /* Video Player Modal */
    .player-modal {
      position: fixed;
      inset: 0;
      background: rgba(12, 14, 18, 0.96);
      z-index: 1000;
      display: none;
      flex-direction: column;
      color: #fff;
      padding-bottom: var(--safe-bottom);
    }

    .player-modal.open {
      display: flex;
    }

    .modal-topbar {
      height: 56px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
    }

    .modal-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      flex: 1;
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .modal-action-btn {
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      text-decoration: none;
      font-size: 12.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .modal-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 12px 56px;
      overflow: hidden;
    }

    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-arrow.prev { left: 12px; }
    .nav-arrow.next { right: 12px; }

    .video-container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    video {
      width: 100%;
      max-height: 70vh;
      background: #000;
      border-radius: 10px;
    }

    .modal-bottom-info {
      width: 100%;
      max-width: 1000px;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mobile-player-nav {
      display: none;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      margin-top: 4px;
    }

    .mobile-player-nav button {
      flex: 1;
      height: 40px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 13.5px;
      font-weight: 500;
    }

    .stream-status {
      font-size: 12.5px;
      color: #a8c7fa;
    }

    .video-caption {
      font-size: 13px;
      color: #e3e3e3;
      max-height: 64px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .empty-state {
      text-align: center;
      padding: 56px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Tối ưu chuyên biệt cho màn hình iPhone / Điện thoại */
    @media (max-width: 768px) {
      .topbar {
        height: 54px;
        padding: 6px 10px;
        gap: 8px;
      }
      .brand {
        width: auto;
      }
      .brand span {
        display: none;
      }
      .search-input {
        height: 38px;
        padding: 0 32px 0 34px;
        font-size: 16px;
      }
      .search-icon {
        left: 11px;
        font-size: 14px;
      }
      .mobile-sync-badge {
        display: inline-flex;
      }
      .sidebar {
        display: none;
      }
      .app-body {
        padding: 0;
      }
      .workspace {
        border-radius: 16px 16px 0 0;
        border-left: none;
        border-right: none;
        border-bottom: none;
      }
      .workspace-header {
        padding: 10px 12px 8px 12px;
        gap: 8px;
      }
      .workspace-title {
        font-size: 17px;
      }
      .content-scroll {
        padding: 10px 10px 24px 10px;
      }
      /* Lưới 2 cột chuẩn Google Drive iOS App trên iPhone 13 */
      .drive-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .drive-card {
        padding: 8px;
        gap: 6px;
        border-radius: 10px;
      }
      .card-header {
        height: 22px;
      }
      .card-title {
        font-size: 12px;
      }
      .star-btn {
        font-size: 15px;
        padding: 2px;
      }
      .duration-pill {
        font-size: 10px;
        padding: 1px 4px;
        bottom: 4px;
        right: 4px;
      }
      .card-footer {
        font-size: 10.5px;
      }
      .mobile-bottom-nav {
        display: flex;
      }
      .modal-stage {
        padding: 10px;
      }
      .nav-arrow {
        display: none;
      }
      .mobile-player-nav {
        display: flex;
      }
      .hide-on-mobile {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">▶</div>
      <span>Drive Bài Giảng</span>
    </div>

    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="Tìm tên bài hoặc mã #ID..."
        autocomplete="off"
      />
      <button id="clearSearchBtn" class="clear-search" title="Xóa">✕</button>
    </div>

    <div class="mobile-sync-badge">
      <span class="sync-dot" id="mobSyncDot"></span>
      <span id="mobSyncText">0</span>
    </div>
  </header>

  <!-- Main Body -->
  <div class="app-body">
    <!-- Left Sidebar (Desktop) -->
    <aside class="sidebar">
      <div class="sync-card">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncText">Đang tải bài giảng...</span>
      </div>

      <nav class="nav-list">
        <div class="nav-item active" data-tab="all" onclick="switchTab('all')">
          <div class="nav-left">
            <span>📁</span>
            <span>Drive của tôi</span>
          </div>
          <span class="nav-count" id="countAll">0</span>
        </div>

        <div class="nav-item" data-tab="recent" onclick="switchTab('recent')">
          <div class="nav-left">
            <span>🕒</span>
            <span>Gần đây</span>
          </div>
          <span class="nav-count" id="countRecent">0</span>
        </div>

        <div class="nav-item" data-tab="starred" onclick="switchTab('starred')">
          <div class="nav-left">
            <span>⭐</span>
            <span>Có gắn dấu sao</span>
          </div>
          <span class="nav-count" id="countStarred">0</span>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div id="loadedSummary">Đang đồng bộ dữ liệu...</div>
        <div style="margin-top: 6px;">
          Kênh nguồn: <a id="channelLink" href="https://t.me/spankbanggggg" target="_blank" rel="noopener">@spankbanggggg</a>
        </div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="workspace">
      <div class="workspace-header">
        <div class="workspace-top-row">
          <h1 class="workspace-title" id="workspaceTitle">Drive của tôi</h1>

          <div class="view-toggle">
            <button id="listViewBtn" class="view-btn" onclick="setViewMode('list')" title="Danh sách">
              ☰
            </button>
            <button id="gridViewBtn" class="view-btn active" onclick="setViewMode('grid')" title="Lưới">
              ✓ ⊞
            </button>
          </div>
        </div>

        <div class="chips-row">
          <button class="chip active" data-duration="all" onclick="setDurationFilter('all')">
            Tất cả
          </button>
          <button class="chip" data-duration="short" onclick="setDurationFilter('short')">
            ⚡ Dưới 5 phút
          </button>
          <button class="chip" data-duration="long" onclick="setDurationFilter('long')">
            🎬 Trên 5 phút
          </button>
          <button class="chip" id="sortChip" onclick="toggleSortOrder()">
            Mới nhất ↓
          </button>
        </div>
      </div>

      <div class="content-scroll" id="contentContainer">
        <div id="itemsMount">
          <div class="empty-state">Đang tải danh sách bài giảng...</div>
        </div>
        <div id="scrollSentinel" class="scroll-sentinel"></div>
      </div>
    </main>
  </div>

  <!-- Bottom Navigation Bar (iPhone / Mobile) -->
  <nav class="mobile-bottom-nav">
    <button class="mob-nav-btn active" data-tab="all" onclick="switchTab('all')">
      <span class="mob-nav-pill">📁</span>
      <span>Drive (<span id="mobCountAll">0</span>)</span>
    </button>
    <button class="mob-nav-btn" data-tab="recent" onclick="switchTab('recent')">
      <span class="mob-nav-pill">🕒</span>
      <span>Gần đây (<span id="mobCountRecent">0</span>)</span>
    </button>
    <button class="mob-nav-btn" data-tab="starred" onclick="switchTab('starred')">
      <span class="mob-nav-pill">⭐</span>
      <span>Dấu sao (<span id="mobCountStarred">0</span>)</span>
    </button>
  </nav>

  <!-- Video Player Modal -->
  <div class="player-modal" id="playerModal">
    <div class="modal-topbar">
      <div class="modal-title-group">
        <button class="modal-close-btn" onclick="closePlayer()" title="Đóng">←</button>
        <div class="video-badge-icon">▶</div>
        <div class="modal-title" id="modalTitle">Bài giảng</div>
      </div>

      <div class="modal-actions">
        <button class="modal-action-btn" id="modalStarBtn" onclick="toggleCurrentStar()">
          ☆ Sao
        </button>
        <a class="modal-action-btn" id="modalTgLink" href="#" target="_blank" rel="noopener">
          Telegram ↗
        </a>
      </div>
    </div>

    <div class="modal-stage" onclick="handleStageClick(event)">
      <button class="nav-arrow prev" onclick="playAdjacent(-1)">❮</button>

      <div class="video-container">
        <video
          id="videoPlayer"
          controls
          autoplay
          playsinline
          webkit-playsinline
          referrerpolicy="no-referrer"
        ></video>

        <div class="modal-bottom-info">
          <div class="mobile-player-nav">
            <button onclick="playAdjacent(-1)">❮ Bài trước</button>
            <button onclick="playAdjacent(1)">Bài tiếp theo ❯</button>
          </div>
          <div class="stream-status" id="streamStatus">Đang chuẩn bị luồng phát...</div>
          <div class="video-caption" id="modalCaption"></div>
        </div>
      </div>

      <button class="nav-arrow next" onclick="playAdjacent(1)">❯</button>
    </div>
  </div>

  <script>
    let allItems = [];
    let existingIds = new Set();
    let channelName = "spankbanggggg";
    let currentId = null;
    let isSyncingDone = false;

    let activeTab = "all";
    let durationFilter = "all";
    let sortDesc = true;
    let viewMode = "grid";

    // Số lượng thẻ vẽ trên DOM mỗi nhịp để iPhone luôn mượt 60FPS
    const PAGE_CHUNK = 48;
    let currentFiltered = [];
    let renderedCount = 0;

    let starredIds = new Set(JSON.parse(localStorage.getItem("tg_starred_ids") || "[]"));
    let recentIds = JSON.parse(localStorage.getItem("tg_recent_ids") || "[]");

    const CACHE_KEY = "tg_all_lectures_cache_v2";

    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");
    const syncDot = document.getElementById("syncDot");
    const syncText = document.getElementById("syncText");
    const mobSyncDot = document.getElementById("mobSyncDot");
    const mobSyncText = document.getElementById("mobSyncText");
    const contentContainer = document.getElementById("contentContainer");
    const itemsMount = document.getElementById("itemsMount");
    const scrollSentinel = document.getElementById("scrollSentinel");
    const playerModal = document.getElementById("playerModal");
    const videoPlayer = document.getElementById("videoPlayer");
    const streamStatus = document.getElementById("streamStatus");

    function parseSeconds(dur) {
      if (!dur) return 0;
      const parts = dur.split(":").map(Number);
      if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      if (parts.length === 2) return parts[0] * 60 + parts[1];
      return parts[0] || 0;
    }

    function saveStorage() {
      localStorage.setItem("tg_starred_ids", JSON.stringify([...starredIds]));
      localStorage.setItem("tg_recent_ids", JSON.stringify(recentIds.slice(0, 50)));
      updateSidebarCounts();
    }

    function updateSidebarCounts() {
      const total = allItems.length;
      const recentCount = recentIds.filter((id) => existingIds.has(id)).length;
      const starCount = [...starredIds].filter((id) => existingIds.has(id)).length;

      document.getElementById("countAll").textContent = total;
      document.getElementById("countRecent").textContent = recentCount;
      document.getElementById("countStarred").textContent = starCount;

      document.getElementById("mobCountAll").textContent = total;
      document.getElementById("mobCountRecent").textContent = recentCount;
      document.getElementById("mobCountStarred").textContent = starCount;
      mobSyncText.textContent = total + " bài";

      if (isSyncingDone) {
        syncDot.classList.add("done");
        mobSyncDot.classList.add("done");
        syncText.textContent = "Đã tải đủ " + total + " bài";
        document.getElementById("loadedSummary").textContent =
          "Hiển thị đầy đủ " + total + " bài giảng";
      } else {
        syncDot.classList.remove("done");
        mobSyncDot.classList.remove("done");
        syncText.textContent = "Đang đồng bộ (" + total + " bài)...";
        document.getElementById("loadedSummary").textContent =
          "Đã tải " + total + " bài giảng...";
      }
    }

    function matchesCurrentFilter(item) {
      if (activeTab === "starred" && !starredIds.has(item.id)) return false;
      if (activeTab === "recent" && !recentIds.includes(item.id)) return false;

      const q = searchInput.value.trim().toLowerCase();
      if (q) {
        const hit =
          item.title.toLowerCase().includes(q) ||
          (item.text && item.text.toLowerCase().includes(q)) ||
          String(item.id).includes(q);
        if (!hit) return false;
      }

      if (durationFilter === "short" && parseSeconds(item.duration) >= 300) return false;
      if (durationFilter === "long" && parseSeconds(item.duration) < 300) return false;

      return true;
    }

    function buildCardHtml(item) {
      const dateStr = item.date ? item.date.slice(0, 10) : "";
      const isStar = starredIds.has(item.id);
      const isPlaying = item.id === currentId && playerModal.classList.contains("open");
      return (
        '<div class="drive-card ' + (isPlaying ? "playing" : "") + '" id="card-' + item.id + '" onclick="openLecture(' + item.id + ')">' +
          '<div class="card-header">' +
            '<div class="card-title-wrap">' +
              '<span class="video-badge-icon">▶</span>' +
              '<span class="card-title">' + escapeHtml(item.title) + "</span>" +
            "</div>" +
            '<button class="star-btn ' + (isStar ? "starred" : "") + '" onclick="toggleStar(event, ' + item.id + ')">' +
              (isStar ? "★" : "☆") +
            "</button>" +
          "</div>" +
          '<div class="card-thumb-box">' +
            (item.thumb
              ? '<img class="card-thumb-img" src="' + item.thumb + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" />'
              : '<div class="thumb-placeholder">🎬</div>') +
            '<div class="play-overlay">▶</div>' +
            (item.duration ? '<span class="duration-pill">' + escapeHtml(item.duration) + "</span>" : "") +
          "</div>" +
          '<div class="card-footer">' +
            "<span>#" + item.id + "</span>" +
            "<span>" + escapeHtml(dateStr) + "</span>" +
          "</div>" +
        "</div>"
      );
    }

    function buildRowHtml(item) {
      const dateStr = item.date ? item.date.slice(0, 10) : "";
      const isStar = starredIds.has(item.id);
      return (
        '<tr id="row-' + item.id + '" onclick="openLecture(' + item.id + ')">' +
          '<td><div class="card-title-wrap"><span class="video-badge-icon">▶</span><span class="card-title">' + escapeHtml(item.title) + "</span></div></td>" +
          "<td>#" + item.id + "</td>" +
          "<td>" + escapeHtml(item.duration || "--:--") + "</td>" +
          '<td class="hide-on-mobile">' + escapeHtml(dateStr) + "</td>" +
          '<td><button class="star-btn ' + (isStar ? "starred" : "") + '" onclick="toggleStar(event, ' + item.id + ')">' + (isStar ? "★" : "☆") + "</button></td>" +
        "</tr>"
      );
    }

    function computeFilteredItems() {
      let list = allItems.filter(matchesCurrentFilter);
      if (activeTab === "recent") {
        const recentMap = new Map(list.map((i) => [i.id, i]));
        list = recentIds.map((id) => recentMap.get(id)).filter(Boolean);
      } else {
        list.sort((a, b) => (sortDesc ? b.id - a.id : a.id - b.id));
      }
      return list;
    }

    // Khởi tạo khung danh sách và chỉ vẽ 48 thẻ đầu tiên
    function renderContent(resetScroll = false) {
      currentFiltered = computeFilteredItems();
      renderedCount = 0;

      if (resetScroll) {
        contentContainer.scrollTop = 0;
      }

      if (!currentFiltered.length) {
        itemsMount.innerHTML =
          '<div class="empty-state">' +
          (isSyncingDone
            ? "Không tìm thấy bài giảng nào phù hợp."
            : "Đang tải dữ liệu bài giảng, vui lòng chờ giây lát...") +
          "</div>";
        scrollSentinel.textContent = "";
        return;
      }

      if (viewMode === "grid") {
        itemsMount.innerHTML =
          '<div class="section-label" id="sectionLabelCount">Tệp bài giảng (' + currentFiltered.length + ")</div>" +
          '<div class="drive-grid" id="driveGrid"></div>';
      } else {
        itemsMount.innerHTML =
          '<table class="drive-list">' +
            "<thead><tr>" +
              "<th>Tên bài giảng</th>" +
              "<th>Mã</th>" +
              "<th>Thời lượng</th>" +
              '<th class="hide-on-mobile">Ngày đăng</th>' +
              "<th>Sao</th>" +
            "</tr></thead>" +
            '<tbody id="driveListBody"></tbody>' +
          "</table>";
      }

      renderNextChunk();
    }

    // Nối thêm 48 thẻ tiếp theo khi người dùng cuộn xuống gần đáy
    function renderNextChunk() {
      if (renderedCount >= currentFiltered.length) {
        scrollSentinel.textContent = "";
        return;
      }

      const slice = currentFiltered.slice(renderedCount, renderedCount + PAGE_CHUNK);
      renderedCount += slice.length;

      if (viewMode === "grid") {
        const gridEl = document.getElementById("driveGrid");
        if (gridEl) {
          gridEl.insertAdjacentHTML("beforeend", slice.map(buildCardHtml).join(""));
        }
      } else {
        const tbodyEl = document.getElementById("driveListBody");
        if (tbodyEl) {
          tbodyEl.insertAdjacentHTML("beforeend", slice.map(buildRowHtml).join(""));
        }
      }

      scrollSentinel.textContent =
        renderedCount < currentFiltered.length
          ? "Đang hiển thị " + renderedCount + " / " + currentFiltered.length + " bài..."
          : "Đã hiển thị toàn bộ " + currentFiltered.length + " bài giảng";
    }

    // Khi có đợt bài mới tải ngầm về, chỉ cập nhật nhẹ không làm giật cuộn trang trên iPhone
    function onNewBatchLoaded() {
      currentFiltered = computeFilteredItems();
      const labelEl = document.getElementById("sectionLabelCount");
      if (labelEl) {
        labelEl.textContent = "Tệp bài giảng (" + currentFiltered.length + ")";
      }
      if (renderedCount === 0 && currentFiltered.length > 0) {
        renderContent(false);
      } else if (renderedCount < PAGE_CHUNK && currentFiltered.length > renderedCount) {
        renderNextChunk();
      } else if (renderedCount < currentFiltered.length) {
        scrollSentinel.textContent =
          "Đang hiển thị " + renderedCount + " / " + currentFiltered.length + " bài...";
      }
    }

    // Quan sát cuộn trang tự động nạp tiếp mượt mà
    const observer = new IntersectionObserver(
      (entries) => {
        if (entries[0].isIntersecting && renderedCount < currentFiltered.length) {
          renderNextChunk();
        }
      },
      { root: contentContainer, rootMargin: "500px" }
    );
    observer.observe(scrollSentinel);

    async function autoLoadAllLectures() {
      try {
        const cached = JSON.parse(sessionStorage.getItem(CACHE_KEY) || "null");
        if (cached && Array.isArray(cached.items) && cached.items.length > 0) {
          allItems = cached.items;
          channelName = cached.channel || channelName;
          existingIds = new Set(allItems.map((i) => i.id));
          isSyncingDone = Boolean(cached.done);
          updateSidebarCounts();
          renderContent(false);
        }
      } catch (_) {}

      let cursor = 0;
      if (allItems.length > 0 && !isSyncingDone) {
        cursor = Math.min(...allItems.map((i) => i.id));
      }

      try {
        const firstRes = await fetch("/api/lectures");
        const firstData = await firstRes.json();
        if (firstRes.ok && !firstData.error) {
          channelName = firstData.channel || channelName;
          const freshItems = (firstData.items || []).filter((i) => !existingIds.has(i.id));
          if (freshItems.length > 0) {
            for (const item of freshItems) {
              existingIds.add(item.id);
              allItems.push(item);
            }
            allItems.sort((a, b) => b.id - a.id);
            updateSidebarCounts();
            renderContent(false);
          }
          if (!cursor) {
            cursor = firstData.next;
          }
        }
      } catch (err) {
        if (!allItems.length) {
          itemsMount.innerHTML =
            '<div class="empty-state" style="color:#d93025">' +
            "<h3>Không thể tải danh sách bài giảng</h3>" +
            '<p style="margin-top:8px">' + escapeHtml(err.message) + "</p></div>";
          return;
        }
      }

      checkUrlHashToOpen();

      // Tải ngầm có nhịp nghỉ 120ms để cảm ứng iPhone luôn mượt
      while (cursor && !isSyncingDone) {
        try {
          const res = await fetch("/api/lectures?before=" + cursor);
          const data = await res.json();
          if (!res.ok || data.error) break;

          let added = 0;
          for (const item of data.items || []) {
            if (!existingIds.has(item.id)) {
              existingIds.add(item.id);
              allItems.push(item);
              added++;
            }
          }

          cursor = data.next;
          if (!cursor) isSyncingDone = true;

          updateSidebarCounts();
          if (added > 0) onNewBatchLoaded();
          checkUrlHashToOpen();

          await new Promise((r) => setTimeout(r, 120));
        } catch (_) {
          await new Promise((r) => setTimeout(r, 1500));
        }
      }

      isSyncingDone = true;
      updateSidebarCounts();
      onNewBatchLoaded();

      // Chỉ ghi vào sessionStorage 1 lần duy nhất khi hoàn tất để không gây đơ iPhone
      try {
        sessionStorage.setItem(
          CACHE_KEY,
          JSON.stringify({ channel: channelName, items: allItems, done: true })
        );
      } catch (_) {}
    }

    function checkUrlHashToOpen() {
      const hashId = Number(location.hash.replace("#", ""));
      if (hashId && !currentId) {
        const target = allItems.find((i) => i.id === hashId);
        if (target) openLecture(target.id);
      }
    }

    function openLecture(id) {
      const item = allItems.find((i) => i.id === id);
      if (!item) return;

      currentId = id;
      location.hash = "#" + id;

      recentIds = [id, ...recentIds.filter((r) => r !== id)];
      saveStorage();

      document.querySelectorAll(".drive-card.playing").forEach((el) => el.classList.remove("playing"));
      const activeCard = document.getElementById("card-" + id);
      if (activeCard) activeCard.classList.add("playing");

      const streamUrl = item.streamUrl || ("/api/stream?id=" + item.id);
      const initialSrc = item.directUrl || streamUrl;

      document.getElementById("modalTitle").textContent = item.title;
      document.getElementById("modalCaption").textContent = item.text || "";
      document.getElementById("modalTgLink").href =
        "https://t.me/" + channelName + "/" + item.id;
      updateModalStarButton();

      streamStatus.style.color = "#a8c7fa";
      streamStatus.textContent = item.directUrl
        ? "Đang phát trực tiếp qua Telegram CDN"
        : "Đang kết nối luồng MTProto Stream (chờ 2-4 giây)...";

      playerModal.classList.add("open");
      videoPlayer.poster = item.thumb || "";
      videoPlayer.src = initialSrc;
      videoPlayer.play().catch(() => {});

      videoPlayer.onloadeddata = () => {
        streamStatus.style.color = "#81c995";
        streamStatus.textContent = "Đang phát #" + item.id + " (" + (item.duration || "") + ")";
      };

      videoPlayer.onerror = async () => {
        if (!videoPlayer.src.includes("/api/stream")) {
          streamStatus.style.color = "#fde293";
          streamStatus.textContent = "Đang chuyển sang luồng MTProto Stream...";
          videoPlayer.src = streamUrl;
          videoPlayer.play().catch(() => {});
          return;
        }
        try {
          const r = await fetch(streamUrl, { headers: { Range: "bytes=0-1023" } });
          if (!r.ok) {
            const errData = await r.json().catch(() => ({}));
            streamStatus.style.color = "#f28b82";
            streamStatus.textContent =
              "Lỗi Stream: " + (errData.error || "HTTP " + r.status);
          }
        } catch (err) {
          streamStatus.style.color = "#f28b82";
          streamStatus.textContent = "Lỗi kết nối Stream: " + err.message;
        }
      };
    }

    function closePlayer() {
      videoPlayer.pause();
      videoPlayer.removeAttribute("src");
      videoPlayer.load();
      playerModal.classList.remove("open");
      history.replaceState(null, "", location.pathname + location.search);
      document.querySelectorAll(".drive-card.playing").forEach((el) => el.classList.remove("playing"));
    }

    function handleStageClick(e) {
      if (e.target.classList.contains("modal-stage")) {
        closePlayer();
      }
    }

    function playAdjacent(step) {
      const idx = currentFiltered.findIndex((i) => i.id === currentId);
      if (idx === -1) return;
      const nextItem = currentFiltered[idx + step];
      if (nextItem) openLecture(nextItem.id);
    }

    function toggleStar(e, id) {
      e.stopPropagation();
      if (starredIds.has(id)) {
        starredIds.delete(id);
      } else {
        starredIds.add(id);
      }
      saveStorage();
      const cardBtn = document.querySelector("#card-" + id + " .star-btn");
      if (cardBtn) {
        const isStar = starredIds.has(id);
        cardBtn.classList.toggle("starred", isStar);
        cardBtn.textContent = isStar ? "★" : "☆";
      }
      if (activeTab === "starred") renderContent(false);
      if (currentId === id) updateModalStarButton();
    }

    function toggleCurrentStar() {
      if (!currentId) return;
      if (starredIds.has(currentId)) {
        starredIds.delete(currentId);
      } else {
        starredIds.add(currentId);
      }
      saveStorage();
      updateModalStarButton();
      renderContent(false);
    }

    function updateModalStarButton() {
      const btn = document.getElementById("modalStarBtn");
      const isStar = starredIds.has(currentId);
      btn.textContent = isStar ? "★ Đã sao" : "☆ Sao";
      btn.style.color = isStar ? "#fbbc04" : "#ffffff";
    }

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll(".nav-item, .mob-nav-btn").forEach((el) => {
        el.classList.toggle("active", el.dataset.tab === tab);
      });
      const titles = {
        all: "Drive của tôi",
        recent: "Xem gần đây",
        starred: "Có gắn dấu sao",
      };
      document.getElementById("workspaceTitle").textContent = titles[tab] || "Drive của tôi";
      renderContent(true);
    }

    function setDurationFilter(filter) {
      durationFilter = filter;
      document.querySelectorAll(".chip[data-duration]").forEach((el) => {
        el.classList.toggle("active", el.dataset.duration === filter);
      });
      renderContent(true);
    }

    function toggleSortOrder() {
      sortDesc = !sortDesc;
      document.getElementById("sortChip").textContent = sortDesc ? "Mới nhất ↓" : "Cũ nhất ↑";
      renderContent(true);
    }

    function setViewMode(mode) {
      viewMode = mode;
      const isGrid = mode === "grid";
      document.getElementById("gridViewBtn").classList.toggle("active", isGrid);
      document.getElementById("listViewBtn").classList.toggle("active", !isGrid);
      document.getElementById("gridViewBtn").textContent = isGrid ? "✓ ⊞" : "⊞";
      document.getElementById("listViewBtn").textContent = !isGrid ? "✓ ☰" : "☰";
      renderContent(false);
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Debounce 150ms giúp gõ phím trên iPhone không bị khựng
    let searchTimer = null;
    searchInput.addEventListener("input", () => {
      clearSearchBtn.style.display = searchInput.value ? "block" : "none";
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => renderContent(true), 150);
    });

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      clearSearchBtn.style.display = "none";
      renderContent(true);
    });

    window.addEventListener("keydown", (e) => {
      if (!playerModal.classList.contains("open")) return;
      if (e.key === "Escape") closePlayer();
      if (e.key === "ArrowLeft") playAdjacent(-1);
      if (e.key === "ArrowRight") playAdjacent(1);
    });

    autoLoadAllLectures();
  </script>
</body>
</html>
