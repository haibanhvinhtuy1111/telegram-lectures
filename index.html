<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thư viện bài giảng</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #172a26;
      color: #e6f2ef;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    /* Sidebar */
    .sidebar {
      width: 260px;
      background: #12221f;
      border-right: 1px solid #253d38;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #253d38;
    }
    .sidebar-header h2 {
      font-size: 18px;
      margin-bottom: 12px;
    }
    .search-box {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #2e4a44;
      background: #0d1917;
      color: #fff;
      outline: none;
    }
    .lecture-list {
      flex: 1;
      overflow-y: auto;
    }
    .lecture-item {
      padding: 12px 16px;
      border-bottom: 1px solid #1b302c;
      cursor: pointer;
      transition: background 0.15s;
    }
    .lecture-item:hover { background: #1c3530; }
    .lecture-item.active {
      background: #2b4530;
      border-left: 3px solid #d4a843;
    }
    .lecture-title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
      color: #f3f7f6;
    }
    .lecture-item.active .lecture-title { color: #f5c451; }
    .lecture-meta {
      font-size: 12px;
      color: #8faea6;
    }
    .load-more-btn {
      margin: 10px;
      padding: 10px;
      background: #182c28;
      color: #e6f2ef;
      border: 1px solid #2e4a44;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    .load-more-btn:hover { background: #223d37; }
    .load-more-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Main Content */
    .main {
      flex: 1;
      padding: 28px 36px;
      overflow-y: auto;
    }
    .main h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }
    .player-wrapper {
      max-width: 900px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }
    video {
      width: 100%;
      max-height: 72vh;
      display: block;
      background: #000;
    }
    .lecture-desc {
      max-width: 900px;
      margin-top: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
      color: #cfe0dc;
    }
    .tg-link {
      display: inline-block;
      margin-top: 16px;
      color: #d4a843;
      text-decoration: underline;
      font-size: 14px;
    }
    .status-badge {
      display: inline-block;
      margin-top: 10px;
      font-size: 12px;
      color: #8faea6;
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Bài giảng</h2>
      <input type="text" id="searchInput" class="search-box" placeholder="Tìm bài giảng" />
    </div>
    <div id="lectureList" class="lecture-list"></div>
    <button id="loadMoreBtn" class="load-more-btn">Tải thêm bài cũ</button>
  </aside>

  <main class="main" id="mainContent">
    <h1>Đang tải bài giảng...</h1>
  </main>

  <script>
    let allItems = [];
    let nextBefore = null;
    let channelName = "spankbanggggg";
    let currentId = null;

    const listEl = document.getElementById("lectureList");
    const mainEl = document.getElementById("mainContent");
    const loadMoreBtn = document.getElementById("loadMoreBtn");
    const searchInput = document.getElementById("searchInput");

    async function fetchLectures(before = 0) {
      loadMoreBtn.disabled = true;
      loadMoreBtn.textContent = "Đang tải...";
      try {
        const res = await fetch(`/api/lectures${before ? `?before=${before}` : ""}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        channelName = data.channel || channelName;
        nextBefore = data.next;

        const existingIds = new Set(allItems.map((i) => i.id));
        for (const item of data.items) {
          if (!existingIds.has(item.id)) allItems.push(item);
        }

        renderList();

        if (!currentId && allItems.length) {
          const hashId = Number(location.hash.replace("#", ""));
          const found = allItems.find((i) => i.id === hashId) || allItems[0];
          selectLecture(found.id);
        }
      } catch (err) {
        mainEl.innerHTML = `<p style="color:#ff7b7b">Lỗi tải danh sách: ${err.message}</p>`;
      } finally {
        loadMoreBtn.disabled = !nextBefore;
        loadMoreBtn.textContent = nextBefore ? "Tải thêm bài cũ" : "Đã hết bài";
      }
    }

    function renderList() {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = allItems.filter(
        (i) => i.title.toLowerCase().includes(q) || String(i.id).includes(q)
      );

      listEl.innerHTML = filtered
        .map((item) => {
          const dateStr = item.date ? item.date.slice(0, 10) : "";
          const activeClass = item.id === currentId ? "active" : "";
          return `
            <div class="lecture-item ${activeClass}" onclick="selectLecture(${item.id})">
              <div class="lecture-title">${escapeHtml(item.title)}</div>
              <div class="lecture-meta">${item.duration} ${dateStr}</div>
            </div>
          `;
        })
        .join("");
    }

    function selectLecture(id) {
      const item = allItems.find((i) => i.id === id);
      if (!item) return;

      currentId = id;
      location.hash = `#${id}`;
      renderList();

      // Ưu tiên link CDN trực tiếp nếu có, nếu video lớn (Media is too big) thì phát qua /api/stream
      const initialSrc = item.directUrl || item.streamUrl;
      const modeText = item.directUrl
        ? "Đang phát trực tiếp qua Telegram CDN"
        : "Đang phát qua MTProto Stream (hỗ trợ video dung lượng lớn)";

      mainEl.innerHTML = `
        <h1>${escapeHtml(item.title)}</h1>
        <div class="player-wrapper">
          <video
            id="videoPlayer"
            src="${initialSrc}"
            poster="${item.thumb || ""}"
            controls
            autoplay
            playsinline
            referrerpolicy="no-referrer"
          ></video>
        </div>
        <div class="status-badge" id="streamStatus">${modeText}</div>
        ${item.text ? `<div class="lecture-desc">${escapeHtml(item.text)}</div>` : ""}
        <div>
          <a class="tg-link" href="https://t.me/${channelName}/${item.id}" target="_blank" rel="noopener">
            Mở trong Telegram
          </a>
        </div>
      `;

      // Nếu link CDN trực tiếp gặp lỗi, tự động chuyển sang /api/stream
      const videoEl = document.getElementById("videoPlayer");
      videoEl.onerror = () => {
        if (videoEl.src !== location.origin + item.streamUrl) {
          document.getElementById("streamStatus").textContent =
            "Đang chuyển sang luồng MTProto Stream...";
          videoEl.src = item.streamUrl;
          videoEl.play().catch(() => {});
        }
      };
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    searchInput.addEventListener("input", renderList);
    loadMoreBtn.addEventListener("click", () => {
      if (nextBefore) fetchLectures(nextBefore);
    });
    window.addEventListener("hashchange", () => {
      const id = Number(location.hash.replace("#", ""));
      if (id && id !== currentId) selectLecture(id);
    });

    fetchLectures();
  </script>
</body>
</html>
